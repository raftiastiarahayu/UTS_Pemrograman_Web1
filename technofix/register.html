<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registrasi — TechnoFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade">
<nav class="navbar navbar-dark px-3">
  <a class="navbar-brand" href="index.html">TechnoFix</a>
  <div class="nav-actions ms-auto"><button class="toggle-btn" onclick="toggleTheme()">🌙</button></div>
</nav>

<main class="container">
  <section class="mt-5 reveal">
    <div class="form-card">
      <h3 class="center mb-3">Buat Akun Baru</h3>

      <form id="regForm">
        <label class="form-label">Nama Lengkap</label>
        <input id="rname" class="form-control mb-3" placeholder="Nama Lengkap">
        <label class="form-label">Email</label>
        <input id="remail" class="form-control mb-3" placeholder="contoh@domain.com">
        <label class="form-label">Password</label>
        <input id="rpass" type="password" class="form-control mb-3" placeholder="Min 6 karakter">

        <button id="regBtn" class="btn btn-primary w-100">Daftar</button>
      </form>

      <div class="center mt-3">Sudah punya akun? <a href="login.html">Masuk</a></div>
    </div>
  </section>
</main>

<footer>
  @Copyright by 23552011392_Rafti Astia Rahayu_23 CNS B
</footer>

<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('regBtn'); btn.disabled = true; btn.textContent = 'Mendaftarkan...';
  const name = document.getElementById('rname').value.trim();
  const email = document.getElementById('remail').value.trim();
  const pass = document.getElementById('rpass').value;
  try{
    if(pass.length < 6) throw 'Password minimal 6 karakter';
    await registerUser(name,email,pass);
    alert('Registrasi berhasil. Silakan login.');
    location.href = 'login.html';
  }catch(err){
    alert(err);
    btn.disabled = false; btn.textContent = 'Daftar';
  }
});
</script>
</body>
</html>
