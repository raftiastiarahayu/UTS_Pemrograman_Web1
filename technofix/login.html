<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — TechnoFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade">
<nav class="navbar navbar-dark px-3">
  <a class="navbar-brand" href="index.html">TechnoFix</a>
  <div class="nav-actions ms-auto"><button class="toggle-btn" onclick="toggleTheme()">🌙</button></div>
</nav>

<main class="container">
  <section class="mt-5 reveal">
    <div class="form-card">
      <h3 class="center mb-3">Masuk ke TechnoFix</h3>

      <form id="loginForm">
        <label class="form-label">Email</label>
        <input id="lemail" class="form-control mb-3" placeholder="admin@gmail.com">
        <label class="form-label">Password</label>
        <input id="lpass" type="password" class="form-control mb-3" placeholder="••••••">

        <button id="logBtn" class="btn btn-primary w-100">Login</button>
      </form>

      <div class="center mt-3">Belum punya akun? <a href="register.html">Daftar</a></div>
    </div>
  </section>
</main>

<footer>
  @Copyright by 23552011392_Rafti Astia Rahayu_23 CNS B
</footer>

<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('logBtn'); btn.disabled=true; btn.textContent='Memeriksa...';
  const email = document.getElementById('lemail').value.trim();
  const pass = document.getElementById('lpass').value;
  try{
    await loginUser(email, pass);
    // success
    setTimeout(()=> location.href = 'menu.html', 400);
  }catch(err){
    alert(err); btn.disabled=false; btn.textContent='Login';
  }
});
</script>
</body>
</html>
