<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Menu Utama — TechnoFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade">
<nav class="navbar navbar-dark px-3">
  <span class="navbar-brand">Dashboard — TechnoFix</span>
  <div class="nav-actions ms-auto">
    <button class="toggle-btn" onclick="toggleTheme()">🌙</button>
    <a id="homeBtn" class="btn btn-light btn-sm" href="index.html">Home</a>
  </div>
</nav>

<main class="container">
  <section class="mt-4 reveal">
    <div class="form-card">
      <h3 id="welcome">Selamat datang</h3>
      <p style="color:var(--muted)">Halaman menu sederhana — contoh akses setelah login.</p>

      <div class="mt-3 services">
        <div class="card" style="padding:12px;">
          <h5 style="margin:0">Profil Perusahaan</h5>
          <p style="color:var(--muted);margin:.35rem 0 0;">TechnoFix — servicing your devices.</p>
        </div>
        <div class="card" style="padding:12px;">
          <h5 style="margin:0">Daftar Layanan</h5>
          <p style="color:var(--muted);margin:.35rem 0 0;">Kelola layanan & harga (mock-up).</p>
        </div>
        <div class="card" style="padding:12px;">
          <h5 style="margin:0">Kontak</h5>
          <p style="color:var(--muted);margin:.35rem 0 0;">Email: service@technofix.id</p>
        </div>
      </div>

      <div class="mt-3">
        <button id="logoutBtn" class="btn btn-outline">Logout</button>
      </div>
    </div>
  </section>
</main>

<footer>
  @Copyright by 23552011392_Rafti Astia Rahayu_23 CNS B
</footer>

<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(function(){
  const s = requireAuth('login.html');
  if(!s) return;
  document.getElementById('welcome').textContent = `Selamat datang, ${s.name}`;
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    logout();
    location.href='login.html';
  });
})();
</script>
</body>
</html>
